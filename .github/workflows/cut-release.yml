# --- This Repository's Own Release ---
#
# 🏷️ Cut Release
#
# Purpose: Publishes a version of the environment: the tag vX.Y.Z and the
# moving vX, the image built from that commit for linux/amd64 and
# linux/arm64 as ghcr.io/tannergolden/environment X.Y.Z, X and latest, and an
# SBOM of each architecture on the release.
#
# ADOPTED FROM THE TEMPLATE, as its note said to for a repository consumed by
# tag: the `if:` guard that kept it inert is gone, and the jobs around the
# standards' own name what this repository ships. The standards' release.yml
# still does the tagging, called rather than copied, so its guards live in
# one place: it refuses a commit that is not on the default branch and a
# version that does not move forward.
#
# EACH ARCHITECTURE IS TESTED ON ITS OWN RUNNER BEFORE ANYTHING IS TAGGED.
# The image is built and its tests run on an amd64 runner and on an arm64
# one, and the version is tagged only when both pass. The publish job then
# builds each architecture again, natively, from the same commit.
#
# DRY RUN FIRST. `dry-run` is on by default: it tests both architectures,
# then builds both the way the release does, and pushes no tag and no image.
# The release's own guards (the default branch, a version that moves
# forward) run only in the real run, before anything is tagged.
#
# ⚠️ Moving `1` changes the image every repository's development container
# will name, for each machine that pulls it next, without anyone on their
# side doing anything. Treat a release as a production change to every
# repository at once.
#
# WHY THE IMAGE IS PUBLISHED IN THIS RUN. The standards' release.yml creates
# the release with the run's own token, and GitHub starts no workflow from
# what that token does, so a stub waiting on the release event would never
# start. The image job runs here instead, after the tag, on the same commit.
#
# WHY THE TAGS ARE PLANNED HERE. The shared publisher tags an image with its
# version and `latest`. The moving major that devcontainer.json files will
# name is this repository's own promise, so the plan step adds it, from the
# version typed in.
#
# THE SBOMS ARE MADE BY JOBS THAT CAN ONLY READ. Each architecture's is made
# on a runner of that architecture, so the generator catalogs that one, and
# a last job attaches both to the release. Past the hardening step every job
# starts with, that job only fetches them and runs `gh`, so the generator
# never holds the token that can write. The SBOMs are kept a week for it,
# which is how long a failed attach can be re-run.
#
# Every version stays: `keep-versions` turns off the prune the standards' Cut
# Release runs for every other repository, because a pinned cloud setup
# script downloads its files from its own tag, which has to keep resolving.

name: '🏷️ Cut Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, as vX.Y.Z'
        required: true
        type: string
      move-major:
        description: "Also move the major tag (vX), and the image's X and latest, to this release"
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Test the image and build both architectures, but publish nothing'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: '🧪 Verify The Release Candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # read the repository
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧪 Verify: lints the commit about to be released, then builds and tests its image for linux/amd64.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🏷️ Plan The Image Tags'
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          MOVE_MAJOR: ${{ inputs.move-major }}
        run: |
          set -euo pipefail
          # The whole input has to be the version, not just one of its lines.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Release::The version has to be vX.Y.Z, such as v1.0.0."
            exit 1
          fi
          version="${VERSION#v}"
          tags="$version"
          if [ "$MOVE_MAJOR" = 'true' ]; then
            tags="$tags ${version%%.*} latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "The image will be tagged: $tags"

      # The Python CI runs the checks on, with the scripts' requirements.
      - name: '🧰 Setup Toolchain'
        uses: tannergolden/standards/.github/actions/setup@v1

      - name: '🧪 Lint, Then Build And Test The Image'
        run: make lint test

  verify-arm64:
    name: '🧪 Verify The Release Candidate (linux/arm64)'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # read the repository
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧪 Verify: builds and tests the image for linux/arm64, on an arm64 runner.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the image tests: the lint and the unit tests are the same on
      # every architecture, and the amd64 job runs them.
      - name: '🧪 Build And Test The Image'
        run: make test-image

  release:
    name: '🏷️ Publish Version & Move Major Tag'
    needs: [verify, verify-arm64]
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write # create tags and publish the release
    uses: tannergolden/standards/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
      move-major: ${{ inputs.move-major }}
      # What a consumer resolves at the tag: the Dockerfile the image is built
      # from, and every file a pinned cloud setup script downloads.
      required-files: >-
        Dockerfile toolchain/install.sh toolchain/versions toolchain/requirements.txt
        toolchain/package.json toolchain/package-lock.json setup/claude-cloud-setup.sh
      check-command: 'make lint'
      keep-versions: true

  image:
    name: '🐳 Publish The Image'
    needs: [verify, verify-arm64, release]
    # After the tag, or, in a dry run, which skips the tag, after the tests.
    # Never once the run is cancelled: stopping a release stops its image.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify-arm64.result == 'success' && (needs.release.result == 'success' || (inputs.dry-run && needs.release.result == 'skipped')) }}
    permissions:
      attestations: write # record the image's provenance attestation
      contents: read # read the repository
      id-token: write # sign the provenance attestation
      packages: write # push the image to GHCR under this repository
    uses: tannergolden/standards/.github/workflows/publish-package.yml@v1
    with:
      container: true
      container-platforms: 'linux/amd64,linux/arm64'
      container-tags: ${{ needs.verify.outputs.tags }}
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}

  sbom:
    name: '🧾 Make The SBOM (linux/${{ matrix.arch }})'
    needs: image
    if: ${{ !inputs.dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      packages: read # read the image it catalogs, whatever its visibility
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧾 SBOM: catalogs one published architecture, on a runner of that architecture.'

      - name: '🔑 Registry Login'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # A multi-architecture image is a list: each architecture is the image
      # tagged with its suffix, which is the thing an SBOM can describe.
      - name: '🏷️ Name The Architecture'
        id: image
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "source=registry:${image}:${VERSION#v}-${ARCH}" >> "$GITHUB_OUTPUT"

      - name: '🧾 Generate The SBOM'
        uses: tannergolden/standards/.github/actions/sbom@v1
        with:
          source: ${{ steps.image.outputs.source }}
          output: 'release/sbom-linux-${{ matrix.arch }}.cdx.json'
          strict: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: '📤 Keep It For The Attach Job'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-linux-${{ matrix.arch }}
          path: release/sbom-linux-${{ matrix.arch }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  attach:
    name: '📎 Attach The SBOMs'
    needs: sbom
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the SBOMs to the release
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: "📎 Attach: adds each architecture's SBOM to the release."

      - name: '📥 Fetch The SBOMs'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-linux-*
          merge-multiple: true
          path: release

      - name: '📎 Attach To The Release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          files=(release/sbom-linux-amd64.cdx.json release/sbom-linux-arm64.cdx.json)
          for file in "${files[@]}"; do
            [ -s "$file" ] || { echo "::error title=SBOM::$file was not made, so no SBOM was attached."; exit 1; }
          done
          gh release upload "$VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached the SBOM of each architecture to $VERSION."
